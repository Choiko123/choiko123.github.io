<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잠자코</title>
  <meta property="og:title" content="잠자코">
  <meta property="og:image" content="logo.png">
  <meta name="theme-color" content="#e2ff1f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- 넥슨 카트 고딕 (제목용, 넥슨 무료 서체) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/KartriderKor/subsets/KartriderKor-dynamic-subset.css">
  <!-- 글마다 다른 폰트 (look) -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700&family=Hahmlet:wght@400;700&family=Nanum+Gothic+Coding:wght@700&family=IBM+Plex+Sans+KR:wght@400&family=Do+Hyeon&family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #e2ff1f;          /* 포인트: 형광노랑 */
      --base: #e9ebee;          /* 바탕: 차가운 회색 */
      --cell: #d5d9de;          /* 칸 회색 */
      --cell-hover: #c9ced4;
      --ink: #111214;
      --ink-light: #2b2d31;
      --ink-faint: #6b7078;
      --line: #b9bec5;
      --serif: 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
      --kart: 'Kartrider Kor', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--base);
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
      overflow-wrap: break-word;
      overflow-x: hidden;
      opacity: 0; animation: fadeIn 0.5s ease 0.05s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    button { font-family: inherit; }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    /* 제호: 형광 띠 */
    .mast { background: var(--neon); margin: 1.5rem 0 0; padding: 0.9rem 1.1rem 1.1rem; }
    .mast-top {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--kart); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.02em;
    }
    .mast-top a { color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 0.55rem; }
    .mast-top a::before { content: ''; width: 0.8rem; height: 0.8rem; background: var(--ink); }
    .mast h1 { margin-top: 0.9rem; line-height: 0; }
    .mast h1 img { display: block; width: 150px; height: auto; }

    /* 검색창 + 보기 버튼 */
    .views {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 1rem;
      background: #f6f7f9;
      padding: 0.45rem 0.6rem 0.45rem 0.9rem;
      margin-bottom: 6px;
    }
    .mag-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; }
    .mag-search svg { flex: none; width: 15px; height: 15px; stroke: var(--ink); }
    .mag-search input {
      flex: 1; min-width: 0; background: none; border: none; outline: none;
      font-family: var(--kart); font-weight: 500; font-size: 0.85rem; color: var(--ink);
      padding: 0.35rem 0;
    }
    .mag-search input::placeholder { color: var(--ink-faint); }
    .mag-search input::-webkit-search-cancel-button { filter: grayscale(1); cursor: pointer; }
    .view-btns { display: flex; gap: 0.3rem; flex: none; }
    .view-btn {
      background: none; border: 1px solid var(--ink); border-radius: 999px;
      padding: 0.26rem 0.72rem 0.2rem;
      font-family: var(--kart); font-weight: 700; font-size: 0.72rem; line-height: 1.4; color: var(--ink); cursor: pointer;
      white-space: nowrap; transition: background 0.15s, color 0.15s;
    }
    @media (hover: hover) { .view-btn:not(.active):hover { background: var(--neon); } }
    .view-btn.active { background: var(--ink); color: var(--neon); }

    /* 묶음 머리 */
    .mag-group { margin-bottom: 6px; }
    .mag-group-head {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.3rem 0.8rem;
      background: var(--ink); color: var(--base);
      padding: 0.8rem 1rem 0.7rem; margin-bottom: 6px;
      font-family: var(--kart);
    }
    .mag-group-no { font-weight: 800; font-size: 1.9rem; line-height: 1; color: var(--neon); }
    .mag-group-title { font-weight: 700; font-size: 1.05rem; }
    .mag-group-sub { font-weight: 500; font-size: 0.72rem; color: #9aa0a8; margin-left: auto; }

    /* 격자 */
    .mag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .mag-card {
      cursor: pointer; min-width: 0; position: relative;
      aspect-ratio: 4 / 5; background: var(--cell);
      display: flex; flex-direction: column; padding: 0.7rem;
      transition: background 0.2s;
    }
    @media (hover: hover) { .mag-card:hover { background: var(--cell-hover); } }
    .mag-cover {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0.6rem 0 0.5rem;
    }
    .mag-cover img {
      height: 100%; max-width: 78%; aspect-ratio: 3 / 4; object-fit: cover; display: block;
      box-shadow: 0 6px 14px rgba(20,24,30,0.22), 0 1px 2px rgba(20,24,30,0.2);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (hover: hover) { .mag-card:hover .mag-cover img { transform: translateY(-3px); } }
    .mag-cap { font-family: var(--kart); }
    .mag-title { font-weight: 700; font-size: 0.86rem; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .mag-sub { font-weight: 500; font-size: 0.64rem; color: var(--ink-faint); margin-top: 0.2rem; display: flex; flex-wrap: wrap; gap: 0 0.45rem; }
    .mag-tag { color: var(--ink); font-weight: 700; }

    /* 사진 없는 글: 형광 칸 */
    .mag-card.feature { background: var(--neon); padding: 0.9rem; }
    @media (hover: hover) { .mag-card.feature:hover { background: #d4f000; } }
    .feature-title {
      font-family: var(--kart); font-weight: 800; font-size: 1.45rem; line-height: 1.15; letter-spacing: -0.01em;
    }
    .feature-text {
      font-size: 0.74rem; line-height: 1.5; margin-top: 0.6rem; color: var(--ink-light);
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    }
    .feature-foot {
      margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;
      font-family: var(--kart); font-weight: 700;
    }
    .feature-no { font-weight: 800; font-size: 1.15rem; line-height: 1; }
    .feature-go { font-size: 0.78rem; }

    .writing-empty { padding: 4rem 1rem; font-family: var(--kart); font-weight: 500; color: var(--ink-faint); background: var(--cell); }

    footer {
      margin-top: 3rem; padding: 1rem 0;
      display: flex; justify-content: space-between;
      font-family: var(--kart); font-weight: 500; font-size: 0.72rem; color: var(--ink-faint);
    }
    footer a { color: inherit; }

    /* 글 본문 */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 400; display: none;
      align-items: flex-start; justify-content: center;
      padding: 5vh 1rem; overflow-y: auto;
      background: rgba(17,18,20,0.6); backdrop-filter: blur(3px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #f6f7f9; max-width: 660px; width: 100%; padding: 0 0 4rem; position: relative;
      animation: modalIn 0.35s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .modal-close {
      position: absolute; top: 0.9rem; right: 0.9rem; z-index: 2;
      width: 2.1rem; height: 2.1rem; border-radius: 50%; border: none;
      background: var(--ink); color: var(--neon); font-size: 0.95rem; line-height: 1; cursor: pointer;
    }
    .modal-cover { width: 100%; display: block; }
    .modal-head { background: var(--neon); padding: 1.6rem 4rem 1.5rem; }
    .modal-tag { font-family: var(--kart); font-weight: 700; font-size: 0.74rem; margin-bottom: 0.7rem; }
    .modal-title { font-family: var(--kart); font-weight: 800; font-size: 1.8rem; line-height: 1.25; letter-spacing: -0.01em; }
    .modal-subtitle { font-family: var(--kart); font-weight: 500; font-size: 0.95rem; line-height: 1.5; margin-top: 0.6rem; }
    .modal-subtitle:empty { display: none; }
    .modal-date { font-family: var(--kart); font-weight: 500; font-size: 0.78rem; margin-top: 0.9rem; }
    .modal-body { padding: 2.6rem 4rem 0; font-size: 1rem; line-height: 1.95; color: var(--ink-light); }
    .modal-body p + p { margin-top: 1.5em; }
    .modal-body .jam-sec { text-align: center; margin: 3em 0 2em; }
    .modal-body .jam-sec:first-child { margin-top: 0; }
    .modal-body .jam-img { display: block; width: 130px; margin: 1.5em 0; mix-blend-mode: multiply; }
    .modal-body blockquote { margin: 1.5em 0; padding-left: 1.2rem; border-left: 3px solid var(--neon); color: var(--ink-faint); }
    .modal-body .jam-notes {
      margin-top: 3em; padding-top: 1.2em; border-top: 1px solid var(--line);
      font-size: 0.8rem; line-height: 1.8; color: var(--ink-faint); overflow-wrap: anywhere;
    }
    .modal-body .jam-notes p + p { margin-top: 0.6em; }
    .modal-body .jam-notes a { color: inherit; }
    .modal-body .jam-photo { margin: 2.2em 0; }
    .modal-body .jam-photo img { display: block; width: 100%; }
    .modal-body .jam-photo figcaption { font-size: 0.78rem; color: var(--ink-faint); text-align: right; margin-top: 0.5em; }
    .modal-body sup { font-size: 0.7em; }

    /* 글마다 다른 폰트·색: posts.js의 look: '이름' → .look-이름 */
    .look-smile .modal-head { background: #20263a; color: #f4f6fb; }
    .look-smile .modal-title { font-family: 'Gowun Dodum', var(--kart); font-weight: 400; }
    .look-smile .modal-body { font-family: 'Gowun Dodum', var(--serif); }
    .look-upbo .modal-head { background: #e8622c; }
    .look-upbo .modal-title { font-family: 'Black Han Sans', var(--kart); font-weight: 400; font-size: 2.6rem; }
    .look-upbo .modal-body { font-family: 'Nanum Myeongjo', var(--serif); }
    .look-bupae .modal-head { background: #dfe5c8; color: #1f2a17; }
    .look-bupae .modal-title { font-family: 'Hahmlet', var(--serif); font-weight: 700; }
    .look-bupae .modal-subtitle { font-family: 'Hahmlet', var(--serif); font-weight: 400; }
    .look-bupae .modal-body { font-family: 'Hahmlet', var(--serif); }
    .look-ranha .modal-head { background: #1b1c3c; color: #e9eaff; }
    .look-ranha .modal-title { font-family: 'Nanum Gothic Coding', var(--kart); font-weight: 700; }
    .look-ranha .modal-body { font-family: 'IBM Plex Sans KR', var(--serif); }
    .look-pee .modal-title { font-family: 'Do Hyeon', var(--kart); font-weight: 400; font-size: 2.2rem; }
    .look-pee .modal-body { font-family: 'Gothic A1', var(--serif); }
    .look-pee .modal-body .jam-sec { font-family: 'Do Hyeon', var(--kart); font-size: 1.3rem; }

    .modal-tags { margin-top: 2.5em; display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .modal-tags .mag-tag {
      font-family: var(--kart); font-size: 0.74rem; background: var(--ink); color: var(--neon);
      border-radius: 999px; padding: 0.2rem 0.7rem 0.12rem;
    }

    @media (max-width: 900px) {
      .mag-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .wrap { padding: 0 0.75rem 4rem; }
      .mast { margin-top: 0.75rem; padding: 0.8rem 0.9rem 0.9rem; }
      .mast h1 { margin-top: 0.7rem; }
      .mast h1 img { width: 110px; }
      .views { gap: 0.6rem; padding-left: 0.7rem; }
      .mag-search input { font-size: 16px; } /* 아이폰에서 누를 때 화면 확대 방지 */
      .view-btns { gap: 0.25rem; }
      .view-btn { padding: 0.26rem 0.6rem 0.2rem; font-size: 0.68rem; }
      .mag-grid { grid-template-columns: 1fr 1fr; gap: 5px; }
      .views, .mag-group, .mag-group-head { margin-bottom: 5px; }
      .mag-card { padding: 0.6rem; }
      .mag-card.feature { padding: 0.75rem; }
      .feature-title { font-size: 1.12rem; }
      .feature-text { font-size: 0.68rem; -webkit-line-clamp: 3; }
      .mag-title { font-size: 0.78rem; }
      .mag-group-no { font-size: 1.6rem; }
      .mag-group-sub { margin-left: 0; width: 100%; }
      .modal-overlay { padding-left: 0.6rem; padding-right: 0.6rem; }
      .modal-head { padding: 1.3rem 1.2rem 1.2rem; }
      .modal-title { font-size: 1.45rem; }
      .modal-body { padding: 2rem 1.2rem 0; font-size: 0.97rem; }
      .modal { padding-bottom: 2.5rem; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <a href="../">CHOIKO</a>
      <span id="magMastCount"></span>
    </div>
    <h1><img src="logo.png" alt="잠자코"></h1>
  </header>

  <div class="views">
    <label class="mag-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="magSearch" placeholder="검색" aria-label="잠자코 글 검색" oninput="renderMag()">
    </label>
    <div class="view-btns" role="tablist">
      <button class="view-btn mag-view-btn active" data-view="all" onclick="setMagView('all')">전체</button>
      <button class="view-btn mag-view-btn" data-view="issue" onclick="setMagView('issue')">호별</button>
      <button class="view-btn mag-view-btn" data-view="author" onclick="setMagView('author')">작가별</button>
    </div>
  </div>

  <div id="magList"></div>

  <footer>
    <span>잠자코 · CHOIKO MAGAZINE</span>
    <span>© 2026</span>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if (event.target === this) closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()" aria-label="닫기">✕</button>
    <img class="modal-cover" id="modalCover" alt="">
    <div class="modal-head">
      <p class="modal-tag" id="modalTag"></p>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-subtitle" id="modalSubtitle"></p>
      <p class="modal-date" id="modalDate"></p>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="posts.js"></script>
<script>
  function openModal(tag, title, date, body, cover, subtitle, look) {
    document.querySelector('.modal').className = 'modal' + (look ? ' look-' + look : '');
    const coverEl = document.getElementById('modalCover');
    if (cover) { coverEl.src = cover; coverEl.style.display = 'block'; }
    else { coverEl.removeAttribute('src'); coverEl.style.display = 'none'; }
    document.getElementById('modalTag').textContent = tag;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalSubtitle').textContent = subtitle || '';
    document.getElementById('modalDate').textContent = date;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalOverlay').scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
    history.replaceState(null, '', location.pathname);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  let magView = 'all';

  function pad2(n) { return String(n).padStart(2, '0'); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function plain(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return d.textContent.replace(/\s+/g, ' ').trim();
  }

  function magCard(p) {
    const i = JAMJAKO_POSTS.indexOf(p);
    // 사진 있는 글은 회색 칸에 표지처럼, 사진 없는 글은 형광 칸에 제목 크게
    if (!p.thumb) {
      return `
        <article class="mag-card feature" onclick="openJamjako(${i})">
          <h3 class="feature-title">${esc(p.title)}</h3>
          <p class="feature-text">${esc(p.subtitle || plain(p.body).slice(0, 120))}</p>
          <div class="feature-foot">
            <span class="feature-no">No.${pad2(p.issue)}</span>
            <span class="feature-go">읽기 →</span>
          </div>
        </article>`;
    }
    return `
      <article class="mag-card" onclick="openJamjako(${i})">
        <div class="mag-cover"><img src="${esc(p.thumb)}" alt="" loading="lazy"${p.thumbPos ? ` style="object-position:${esc(p.thumbPos)}"` : ''}></div>
        <div class="mag-cap">
          <h3 class="mag-title">${esc(p.title)}</h3>
          <p class="mag-sub"><span>No.${pad2(p.issue)} · ${esc(p.author)}</span>${(p.tags || []).map(t => `<span class="mag-tag">#${esc(t)}</span>`).join('')}</p>
        </div>
      </article>`;
  }

  function magTags(p) {
    if (!p.tags || !p.tags.length) return '';
    return `<div class="mag-tags">${p.tags.map(t => `<span class="mag-tag">#${esc(t)}</span>`).join('')}</div>`;
  }

  function magGrid(list) { return `<div class="mag-grid">${list.map(magCard).join('')}</div>`; }

  // 제목·본문·작가·태그에서 찾기 (띄어쓰기·대소문자 무시)
  function norm(s) { return String(s).toLowerCase().replace(/\s+/g, ''); }
  function postText(p) {
    if (!p._text) {
      p._text = norm([p.title, p.subtitle || '', p.author, `no.${pad2(p.issue)}`, (p.tags || []).map(t => '#' + t).join(''), plain(p.body)].join(' '));
    }
    return p._text;
  }

  function renderMag() {
    const el = document.getElementById('magList');
    // 최신 호, 같은 호 안에서는 적은 순서대로
    const all = JAMJAKO_POSTS.slice().sort((a, b) => b.issue - a.issue);
    const mc = document.getElementById('magMastCount');
    if (mc) {
      const nos = JAMJAKO_ISSUES.map(i => i.no);
      mc.textContent = nos.length ? `No.${pad2(Math.max(...nos))} · ${all.length}편` : '창간 준비호';
    }

    if (!all.length) {
      el.innerHTML = '<p class="writing-empty">첫 호를 준비하고 있어요.</p>';
      return;
    }

    const q = norm(document.getElementById('magSearch').value);
    const posts = q ? all.filter(p => postText(p).includes(q)) : all;
    if (!posts.length) {
      el.innerHTML = '<p class="writing-empty">찾는 글이 없어요.</p>';
      return;
    }

    if (magView === 'all') {
      el.innerHTML = magGrid(posts);
    } else if (magView === 'issue') {
      const issues = JAMJAKO_ISSUES.slice().sort((a, b) => b.no - a.no);
      el.innerHTML = issues.map(is => {
        const list = posts.filter(p => p.issue === is.no);
        if (!list.length) return '';
        return `
          <section class="mag-group">
            <div class="mag-group-head">
              <span class="mag-group-no">No.${pad2(is.no)}</span>
              <span class="mag-group-title">${esc(is.theme || '')}</span>
              <span class="mag-group-sub">${esc(is.date || '')}</span>
            </div>
            ${magGrid(list)}
          </section>`;
      }).join('');
    } else {
      const authors = [...new Set(posts.map(p => p.author))].sort((a, b) => a.localeCompare(b, 'ko'));
      el.innerHTML = authors.map(name => {
        const list = posts.filter(p => p.author === name);
        return `
          <section class="mag-group">
            <div class="mag-group-head">
              <span class="mag-group-title">${esc(name)}</span>
              <span class="mag-group-sub">${list.length}편</span>
            </div>
            ${magGrid(list)}
          </section>`;
      }).join('');
    }
  }

  function setMagView(v) {
    magView = v;
    document.querySelectorAll('.mag-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    renderMag();
  }

  function openJamjako(i, fromHash) {
    const p = JAMJAKO_POSTS[i];
    if (!p) return;
    if (!fromHash) history.replaceState(null, '', '#' + (i + 1));
    openModal(`잠자코 · No.${pad2(p.issue)}`, p.title, `${p.author} · ${p.date}`, p.body + magTags(p).replace('mag-tags', 'mag-tags modal-tags'), p.cover || p.thumb, p.subtitle, p.look);
  }

  renderMag();
